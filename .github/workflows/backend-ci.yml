name: Backend CI

# Corre lint + tests de backend en cada push/PR que toque ese 
# directorio. La suite ya existía pero hasta ahora solo se ejecuta a mano.
# Los cambios de este workflow solo se aplican después de subir el archivo a la rama.
on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
      - uses: actions/checkout@v7
        with: 
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heroesdelcorazon
          POSTGRES_USER: heroes_user
          POSTGRES_PASSWORD: heroes_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis: 
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
      DJANGO_DEBUG: "True"
      POSTGRES_DB: heroesdelcorazon
      POSTGRES_USER: heroes_user
      POSTGRES_PASSWORD: heroes_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt

      - name: Migrations aplican sin errores
        run: python manage.py migrate --noinput
      
      - name: No hay cambios de modelo sin migración
        run: python manage.py makemigrations --check --dry-run
      
      - name: Tests
        run: pytest 
